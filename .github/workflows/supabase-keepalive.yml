# Supabase 무료 프로젝트는 7일 동안 접속이 없으면 일시 정지됩니다.
# 이 작업이 매주 월·목 오전 9시(한국 시간)에 자동으로 한 번씩 접속해서 정지를 막습니다.
# 또 매달 1일에는 기록 파일(.github/keepalive.txt)을 갱신합니다.
# GitHub은 60일 동안 저장소에 변화가 없으면 예약 작업을 멈추기 때문에, 이렇게 해서 예약 작업도 계속 돌게 합니다.
# 사용하는 키는 index.html에도 들어 있는 공개용(publishable) 키라 노출돼도 괜찮습니다.

name: Supabase 정지 방지

on:
  schedule:
    - cron: '0 0 * * 1,4'   # 월·목 00:00 UTC = 09:00 KST
    - cron: '0 1 1 * *'     # 매달 1일 01:00 UTC
  workflow_dispatch: {}      # Actions 탭에서 "Run workflow"로 직접 실행 가능

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase에 접속
        env:
          SUPABASE_URL: https://ixvrgqsldvkhtdkledhq.supabase.co
          SUPABASE_KEY: sb_publishable_KIUlw_4q5gkavld61JIWIQ_CQMZNhnz
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/docs?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase 응답: $code"
          test "$code" = "200"

  monthly-touch:
    if: github.event.schedule == '0 1 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 저장소 활동 기록 갱신
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "정지 방지: 월간 활동 기록" || echo "변경 없음"
          git push
